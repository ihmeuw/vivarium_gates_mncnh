# NOTE: This file is a copy of baseline_only.yaml with the scenarios added.
# If you're editing, make sure to keep these two files in sync!

input_draw_count: 10
random_seed_count: 10

input_draws: [115, 60, 118, 197, 79, 244, 22, 167, 146, 71]
# Pinned to the model39.0 run's seeds so model39.2 is a paired rerun of it. Left
# unpinned, psimulate generates seeds, and the generator changed with the monorepo
# migration -- which is why model39.1 drew different seeds than model39.0 despite
# both asking for random_seed_count: 10.
random_seeds: [2284, 2787, 3254, 3541, 4344, 4369, 5020, 5616, 6810, 7359]
# Draws should NOT be equal to mod 100, meaning draws 115 and 215 should not be used together
# due to the 2023 Hemoglobin exposure data only having 100 draws.
# Other draws that have been generated available to use: 28, 156, 94, 170, 109, 26, 35, 114, 178, 127
# Standard V&V scenarios for the model 39.0 "PPH/APH split updates" run (MIC-7286).
# Only the "Standard V&V scenarios list" from the concept model docs is active;
# the remaining portfolio scenarios are commented out (not deleted) for this run.
branches:
  - intervention:
      scenario:
        - 'baseline'
        # - "cpap_acs_scaleup"
        # - "cpap_acs_ai_ultrasound_scaleup"
        # - "neonatal_antibiotics_scaleup"
        # - "neonatal_probiotics_scaleup"
        - "azithromycin_scaleup"
        # - "ai_ultrasound_scaleup"
        # - "standard_ultrasound_scaleup"
        # - "full_product_scaleup"
        - "mms_total_scaleup"
        - "anemia_screening_and_iv_iron_scaleup"
        - "azithromycin_vv"
        - "misoprostol_vv"
        # - "no_acs_and_total_cpap_vv"
        # - "total_acs_and_cpap_vv"
        # - "total_acs_and_no_cpap_vv"
        # - "ultrasound_vv"
        - "anemia_screening_vv"
    # No population override here: a branch-level population_size silently wins over
    # model_spec.yaml, which is how the model39.1 run ended up at a tenth of model39.0's
    # 200,000 and lost comparability with it. Let the model spec govern the size.
