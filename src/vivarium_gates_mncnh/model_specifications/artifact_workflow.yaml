workflow:
  name: "test_pipeline"
  project: "proj_simscience"
  queue: "all.q"
  output_directory: INSERT_VALID_DIRECTORY
  # ==========================================================================
  # Pre-simulation data generation pipeline.
  #
  # Dagger steps run STRICTLY SEQUENTIALLY (every task in a step depends on all
  # tasks of the previous step). Parallelism therefore lives INSIDE steps:
  #   - parallel_runner.py  -> fans draws across `cores` on one node
  #   - run_paf_sim.py      -> fans draws via psimulate (jobmon)
  #   - generate_pafs.py / generate_caps.py -> serial internally
  #
  # Steps are ordered by dependency. Resource values are first-pass estimates
  # -- tune as needed. Output paths are INSERT_VALID_DIRECTORY placeholders;
  # set them to valid, writable directories before running.
  # ==========================================================================
  steps:
    # ---- Step 0: guard -- fail fast if the working tree is dirty -------------
    # Run this BEFORE anything that writes into the checkout. run_main_sim's
    # _update_model_results_dir() rewrites constants/paths.py as part of
    # launching, so re-running this guard after that step will fail on a file
    # the tooling itself wrote. The guard is scoped to code that can change
    # results, and paths.py is read only by the results notebooks, so the
    # ordering is the fix here -- not widening the guard's exclusions.
    - name: "check_clean_working_tree"
      type: python
      environment: &artifact_env INSERT_ARTIFACT_ENV_PREFIX
      resources:
        memory_gb: 1
        runtime: "00:01:00"
      args:
        path: src/vivarium_gates_mncnh/tools/check_working_tree.py

    # ---- Step 1: hemoglobin -> birth effects (LBWSG shifts), per draw --------
    # Parallel across draws via parallel_runner.py. Produces lbwsg_shifts/ and
    # iv_iron_lbwsg_shifts/, read by Step 3 (sepsis) and by make_artifacts.
    - name: "hemoglobin_effects_birth"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 40
        runtime: "04:00:00"
        cores: 5
      args:
        path: src/vivarium_gates_mncnh/data/hemoglobin_effects/parallel_runner.py
        positional_args:
          - "--workers"
          - 5
          - "--"
          - generate_birth_effects.py

    # ---- Step 2: IV-iron stillbirth effects (single invocation) --------------
    # calculate_iv_iron_stillbirth_effects() loops all draws internally and is
    # NOT draw-parallel, so it runs as a single-task step via the __main__ block
    # in hgb_birth_effect_generation.py. Independent of Step 1's outputs.
    - name: "hemoglobin_iv_iron_stillbirth"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "00:30:00"
      args:
        path: src/vivarium_gates_mncnh/data/hemoglobin_effects/hgb_birth_effect_generation.py

    # ---- Step 3: hemoglobin -> neonatal sepsis effects, per draw -------------
    # Parallel across draws via parallel_runner.py. Reads lbwsg_shifts/ from
    # Step 1, so Step 1 must complete first.
    - name: "hemoglobin_effects_sepsis"
      type: python
      environment: &simulation_env INSERT_SIMULATION_ENV_PREFIX
      resources:
        memory_gb: 40
        runtime: "02:00:00"
        cores: 5
      args:
        path: src/vivarium_gates_mncnh/data/hemoglobin_effects/parallel_runner.py
        positional_args:
          - "--workers"
          - 5
          - "--"
          - generate_nn_sepsis_effects.py

    # ---- Step 4: maternal-disorder PAFs --------------------------------------
    - name: "hgb_maternal_disorders_pafs"
      type: python
      environment: *simulation_env
      resources:
        memory_gb: 16
        runtime: "06:00:00"
      args:
        path: src/vivarium_gates_mncnh/data/hgb_pafs_maternal_disorders/code/generate_pafs.py

    # ---- Step 5: LBWSG relative-risk caps (one step per location) ------------
    # generate_caps.py is per-location and serial; split into 3 steps. Must
    # precede Step 6 (the PAF sim's artifact bakes in these caps).
    - name: "lbwsg_caps_ethiopia"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:00:00"
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_rr_caps/generate_caps.py
        keyword_args:
          l: "Ethiopia"
    - name: "lbwsg_caps_nigeria"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:00:00"
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_rr_caps/generate_caps.py
        keyword_args:
          l: "Nigeria"
    - name: "lbwsg_caps_pakistan"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:00:00"
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_rr_caps/generate_caps.py
        keyword_args:
          l: "Pakistan"

    # ---- Step 6: LBWSG PAFs ---------------------------------------------------
    # Needs the RR caps from Step 5. run_paf_sim.py alternates between the two
    # environments -- make_artifacts needs the artifact env, psimulate needs the
    # simulation env -- so rather than have the script dispatch commands into an
    # environment it is not in, each phase is its own step and the runner selects
    # the environment. Each step asserts it is in the right one and aborts in
    # seconds if not, so a wrong anchor below fails fast rather than deep inside
    # a job.
    #
    # The five phases are strictly ordered and share state on disk: the artifact
    # at <output-dir>/<location>.hdf, and the PAF parquet files under
    # data/lbwsg_paf/outputs/. Each *-paf phase harvests its own psimulate
    # results before finishing, so no phase depends on another's scratch
    # directory. Do not reorder them.
    #
    # LOCATIONS ARE NOT NAMED HERE ON PURPOSE. Each step runs every location in
    # constants.metadata.LOCATIONS, which is the single place to add one -- and
    # run_main_sim reads the same list. Dagger runs steps strictly sequentially,
    # so a task per location would buy no parallelism, only YAML. Pass -l to
    # restrict a run to a subset.
    - name: "paf_initial_artifact"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:30:00"
        requires_archive_node: True
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_paf/code/run_paf_sim.py
        keyword_args:
          step: initial-artifact
          a: test_workflow
          output-dir: INSERT_VALID_DIRECTORY
    - name: "paf_enn_paf"
      type: python
      environment: *simulation_env
      resources:
        memory_gb: 16
        runtime: "03:00:00"
        requires_archive_node: True
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_paf/code/run_paf_sim.py
        keyword_args:
          step: enn-paf
          a: test_workflow
          output-dir: INSERT_VALID_DIRECTORY
    - name: "paf_enn_artifact"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:30:00"
        requires_archive_node: True
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_paf/code/run_paf_sim.py
        keyword_args:
          step: enn-artifact
          a: test_workflow
          output-dir: INSERT_VALID_DIRECTORY
    - name: "paf_lnn_paf"
      type: python
      environment: *simulation_env
      resources:
        memory_gb: 16
        runtime: "03:00:00"
        requires_archive_node: True
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_paf/code/run_paf_sim.py
        keyword_args:
          step: lnn-paf
          a: test_workflow
          output-dir: INSERT_VALID_DIRECTORY
    - name: "paf_final_artifact"
      type: python
      environment: *artifact_env
      resources:
        memory_gb: 16
        runtime: "01:30:00"
        requires_archive_node: True
      args:
        path: src/vivarium_gates_mncnh/data/lbwsg_paf/code/run_paf_sim.py
        keyword_args:
          step: final-artifact
          a: test_workflow
          output-dir: INSERT_VALID_DIRECTORY

    # ---- Step 7: build artifacts for all locations (terminal step) -----------
    # make_artifacts reads the generated caps / hemoglobin / PAF outputs and
    # builds the .hdf per location.
    # NOTE: -o must be the same INSERT_VALID_DIRECTORY the PAF sim (Step 6) built the artifact in.
    - name: "make_artifacts"
      environment: *artifact_env
      command: 'bash -lc "yes y | make_artifacts -l all -o INSERT_VALID_DIRECTORY/"'
      resources:
        memory_gb: 1
        runtime: "01:00:00"
