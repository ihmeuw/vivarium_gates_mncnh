[build-system]
requires = ["setuptools>=61.0", "setuptools_scm[toml]>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vivarium_gates_mncnh"
description = "Research repository for the vivarium_gates_mncnh project."
readme = "README.rst"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [{name = "The vivarium developers", email = "vivarium.dev@gmail.com"}]
dynamic = ["version"]
dependencies = [
    "vivarium-dependencies<2.0.0",
    "vivarium-dependencies[pandas,numpy,scipy,click,tables,loguru]",
    "vivarium-build-utils>=4.0.0,<5.0.0",
    "vivarium-gbd-mapping>=6.0.0,<7.0.0",
    "vivarium-config-tree",
    "vivarium-engine>=5.10.0,<6.0.0",
    "vivarium-public-health>=6.6.3,<7.0.0",
    # TODO: add version bounds to these two at release (vivarium_gbd_access 8.x and the
    # vivarium_inputs that needs it), and drop their [tool.uv.sources] entries.
    "vivarium-inputs",
    "vivarium-gbd-access",
    "click",
    "jinja2",
    "pyyaml",
    "statsmodels",
]

[dependency-groups]
# One group for the whole environment, so a bare `uv sync` builds everything.
dev = [
    # test
    "vivarium-dependencies[pytest]",
    "papermill",
    "jupyterlab",
    "pytest-vivarium>=0.2.0",
    "vivarium-fuzzy-checker>=0.5.0",
    # cluster
    "vivarium-cluster-tools[cluster]>=4.0.0,<5.0.0",
    # Older jobmon imports pkg_resources, which setuptools 81+ removed.
    "jobmon_installer_ihme>=10.12.0",
    # cluster-tools' pip_env.validate runs `pip list`, and uv venvs have no pip.
    # TODO: remove once cluster-tools supports venvs without pip (MIC-7684).
    "pip",
    # validation
    "vivarium-validation>=0.4.0",
    # interactive
    "vivarium-dependencies[interactive]",
    "nbdime",
    # lint
    "vivarium-dependencies[lint]",
]

[project.urls]
Homepage = "https://github.com/ihmeuw/vivarium_gates_mncnh"

[project.scripts]
make_artifacts = "vivarium_gates_mncnh.tools.cli:make_artifacts"

[tool.uv]
# TODO: add required-version and a vivarium-build-utils floor once build-utils
# reads the version from uv.lock (MIC-7678) and that release is tested (MIC-7681).
index-strategy = "unsafe-best-match"
python-preference = "only-managed"
# Rebuild the package when the commit or tags change, so the setuptools_scm version stays current.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]
# The vivarium_gbd_access branch builds as a 6.1.1 dev version, which fails the
# vivarium-gbd-access>=8.0.0 that vivarium_inputs requires, so force it.
# TODO: remove this with the git sources below.
# vivarium-validation caps pandera below 0.23, and pandera 0.22 fails to import
# vivarium.validation under numpy 2.
# TODO: remove the pandera override once vivarium-validation drops the cap (MIC-7662).
override-dependencies = [
    "pandas<3.0.0",
    "pandera>=0.23.0",
    "vivarium-gbd-access",
]

[[tool.uv.index]]
name = "ihme-artifactory"
url = "https://artifactory.ihme.washington.edu/artifactory/api/pypi/pypi-shared/simple/"

[tool.uv.sources]
# Unreleased framework commits. These must not reach main (see
# .github/workflows/no_unreleased_sources_on_main.yml).
vivarium-inputs = { git = "https://github.com/ihme-internal/vivarium_inputs.git", rev = "9d1c2fe" }
vivarium-gbd-access = { git = "https://github.com/ihme-internal/vivarium_gbd_access.git", rev = "70391248ea" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/vivarium_gates_mncnh/_version.py"
version_file_template = "__version__ = \"{version}\"\n"
tag_regex = '^(?P<prefix>v)?(?P<version>[^\+]+)(?P<suffix>.*)?$'
fallback_version = "0.0.0+no-git-tag"
# Only use release tags (v<number>.<number>...) for the version. Otherwise a stray tag
# like vtest_mic7347 breaks every install, as it did the 2026-10-06 nightly build.
git_describe_command = ["git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*.[0-9]*"]
tag.strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-nauto"
markers = ["results: tests in model_notebooks/results"]

[tool.black]
line_length = 94

[tool.isort]
profile = "black"
